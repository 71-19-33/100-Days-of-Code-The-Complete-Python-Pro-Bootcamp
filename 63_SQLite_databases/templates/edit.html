<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit Rating</title>
  </head>
  <body>
    <form action= "{{ url_for('edit', book_id=book.id) }}" method="POST">
      <label>Book Name: {{book.title}}</label><br>
      <br>
      <label>Book Author: {{book.author}}</label><br>
      <br>
      <label>Current Rating: {{book.rating}}</label><br>
      <br>
      <input name="rating" type="text" placeholder="New Rating" />
      <button type="submit">Change Rating</button>
    </form>
  </body>
</html>
